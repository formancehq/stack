$schema: http://json-schema.org/draft-07/schema#
type: object
required:
  - app
  - version
  - date
  - type
  - payload
properties:
  idempotency_key:
    type: string
  app:
    const: gateway
  version:
    const: v2
  date:
    type: string
    format: date-time
    description: Publication time; for native gRPC, the RPC termination time.
  type:
    type: string
  payload:
    type: object
definitions:
  auditHeaders:
    type: [object, "null"]
    additionalProperties:
      type: [array, "null"]
      items:
        type: string
  grpcAuditBody:
    type: object
    required:
      - encoding
      - bytes_total
      - truncated
      - complete
    properties:
      encoding:
        const: base64
      data:
        type: string
        contentEncoding: base64
        maxLength: 87384
        pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
        allOf:
          - if:
              minLength: 87384
            then:
              pattern: '==$'
        description: Base64 prefix of at most 65536 observed gRPC body bytes, including message envelopes and compression. Omitted when empty.
      bytes_total:
        type: integer
        minimum: 0
        description: Bytes observed before finalization, including bytes beyond the capture limit.
      truncated:
        type: boolean
        description: Observed bytes exceeded the stored prefix; traffic itself is not truncated.
      complete:
        type: boolean
        description: Request EOF was observed, or the response handler completed with a valid gRPC status and no local interruption. This does not prove client consumption.
