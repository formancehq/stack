type: object
properties:
  type:
    enum:
      - COMMITTED_TRANSACTION
  log:
    type: object
    properties:
      payload:
        type: object
        required:
          - apply
        properties:
          apply:
            allOf:
              - $ref: "#/definitions/apply"
              - type: object
                properties:
                  log:
                    type: object
                    properties:
                      type:
                        enum:
                          - NEW_TRANSACTION
                      data:
                        type: object
                        required:
                          - createdTransaction
                        properties:
                          createdTransaction:
                            $ref: "#/definitions/createdTransaction"
